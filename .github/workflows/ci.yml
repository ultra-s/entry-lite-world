name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: world
          POSTGRES_PASSWORD: world
          POSTGRES_DB: workflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENTRYLITE_WORLD_URL: postgres://world:world@127.0.0.1:5432/workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm install --no-audit --no-fund && break || {
              echo "npm attempt $i failed, retrying in 15s"; rm -rf node_modules; sleep 15;
            }
          done
          test -d node_modules
      - run: npm run build
      # The world bootstraps its schema; tests create what they need.
      - run: node --test test/contract-conformance.test.mjs
      - run: node --test test/e2e-world.test.mjs
      - run: node test/namespace-isolation.test.mjs
