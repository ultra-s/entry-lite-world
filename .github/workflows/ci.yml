name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: world
          POSTGRES_PASSWORD: world
          POSTGRES_DB: workflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENTRYLITE_WORLD_URL: postgres://world:world@127.0.0.1:5432/workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: npm run build
      - name: Bootstrap schema
        run: node dist/bootstrap.js "$ENTRYLITE_WORLD_URL"
      - run: node --test test/contract-conformance.test.mjs
      - run: node --test test/e2e-world.test.mjs
      - run: node test/namespace-isolation.test.mjs
